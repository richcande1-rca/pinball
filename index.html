<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miami Nights Pinball</title>
  <link rel="stylesheet" href="style.css?v=20260825-2257">
</head>
<body>
  <section id="intro-screen" class="intro-screen" aria-label="Miami Nights title screen">
    <div class="intro-scanlines" aria-hidden="true"></div>
    <div class="intro-panel">
      <p class="intro-kicker">A NEON PINBALL STORY</p>
      <h2><span>MIAMI</span> NIGHTS</h2>
      <p id="intro-status" class="intro-status">Turn up the sound</p>
      <button id="intro-start" class="intro-button" type="button">START</button>
      <button id="intro-skip" class="intro-skip" type="button" hidden>SKIP INTRO</button>
    </div>
  </section>

  <audio
    id="theme-music"
    src="assets/miami-nights-theme-v16.mp3?v=20260825-0545"
    loop
    preload="auto"
    playsinline
  ></audio>

  <main class="game-shell">
    <h1><span>MIAMI</span> NIGHTS</h1>
    <div class="music-controls" role="group" aria-label="Music controls">
      <label for="music-volume">MUSIC</label>
      <input
        id="music-volume"
        type="range"
        min="0"
        max="100"
        step="1"
        value="45"
        aria-label="Music volume"
      >
      <button id="music-mute" type="button" aria-pressed="false">MUSIC ON</button>
    </div>
    <div class="table-cabinet" role="group" aria-label="Pinball cabinet controls">
      <canvas id="game" width="480" height="720" aria-label="Playable Miami Nights pinball table"></canvas>
      <button
        id="left-flipper-button"
        class="cabinet-button cabinet-button-left"
        type="button"
        aria-label="Left flipper"
        aria-pressed="false"
      ><span aria-hidden="true">◀</span></button>
      <button
        id="right-flipper-button"
        class="cabinet-button cabinet-button-right"
        type="button"
        aria-label="Right flipper"
        aria-pressed="false"
      ><span aria-hidden="true">▶</span></button>
      <button
        id="launch-button"
        class="cabinet-button cabinet-button-launch"
        type="button"
        aria-label="Hold to charge plunger; release to launch"
        aria-pressed="false"
      ><span aria-hidden="true">LAUNCH</span></button>
    </div>
    <p>
      Flippers: <kbd>Z</kbd> and <kbd>/</kbd> (or <kbd>←</kbd> and <kbd>→</kbd>).
      Plunger: hold <kbd>Space</kbd> or <strong>LAUNCH</strong>, then release. Reset: <kbd>R</kbd>.
      Cabinet buttons work with touch, mouse, or pen.
      Build 20260825-2318.
    </p>
  </main>

  <script src="intro.js?v=20260825-0545"></script>
  <script src="game.js?v=20260825-2318"></script>
  <script src="theme.js?v=20260825-2318"></script>
  <script src="audio.js?v=20260825-0545"></script>
</body>
</html>
