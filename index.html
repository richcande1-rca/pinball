<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinball Physics Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <h1>PINBALL</h1>
    <canvas id="game" width="480" height="720" aria-label="Playable pinball physics test"></canvas>
    <p>
      Flippers: <kbd>←</kbd>/<kbd>Z</kbd> and <kbd>→</kbd>/<kbd>X</kbd>.
      Reset: <kbd>Space</kbd> or <kbd>R</kbd>. On touch, press the left or right half of the table.
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
